<!DOCTYPE html>

<html>

<head>

```
<title>Student Management</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

<div class="container">

```
<!-- Header -->

<div class="card">

    <div class="page-header">

        <div>

            <h1 style="
                color:#4f46e5;
                margin:0;
                font-size:42px;
            ">
                Student Management
            </h1>

            <p style="
                color:#64748b;
                margin-top:10px;
            ">
                Create, update and manage student profiles
            </p>

        </div>

        <button
            onclick="
            window.location.href=
            'dashboard.html'
            "
        >
            Dashboard
        </button>

    </div>

</div>

<!-- Statistics -->

<div class="stats-grid">

    <div class="stat-card">

        <h3>Total Students</h3>

        <h1 id="studentCount">
            --
        </h1>

    </div>

    <div class="stat-card">

        <h3>Departments</h3>

        <h1>
            3
        </h1>

    </div>

    <div class="stat-card">

        <h3>Average GPA</h3>

        <h1>
            8.2
        </h1>

    </div>

</div>

<!-- Student Form -->

<div class="card">

    <h2 style="
        color:#4f46e5;
        margin-bottom:20px;
    ">
        Add Student
    </h2>

    <div class="form-grid">

        <input
            type="number"
            id="user_id"
            placeholder="User ID"
        >

        <input
            type="text"
            id="department"
            placeholder="Department"
        >

        <input
            type="number"
            step="0.1"
            id="gpa"
            placeholder="Current GPA"
        >

        <input
            type="text"
            id="interests"
            placeholder="Interests"
        >

        <input
            type="text"
            id="career_goal"
            placeholder="Career Goal"
        >

    </div>

    <button
        onclick="saveStudent()"
    >
        Save Student
    </button>

</div>

<!-- Student Records -->

<div class="card">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
    ">

        <h2 style="
            color:#4f46e5;
            margin:0;
        ">
            Student Records
        </h2>

        <button
            onclick="loadStudents()"
        >
            Refresh Students
        </button>

    </div>

    <div style="
        overflow-x:auto;
    ">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>User ID</th>
                    <th>Department</th>
                    <th>GPA</th>
                    <th>Interests</th>
                    <th>Career Goal</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody
                id="studentTable"
            >
            </tbody>

        </table>

    </div>

</div>
```

</div>

<script src="js/api.js"></script>

<script src="js/students.js"></script>

</body>

</html>
