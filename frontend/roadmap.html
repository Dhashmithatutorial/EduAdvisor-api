<!DOCTYPE html>
<html>

<head>

    <title>Learning Roadmap</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <!-- Navbar -->

    <div class="card navbar">

        <div>

            <h1>
                 Learning Roadmap
            </h1>

            <p style="
            color:gray;
            ">
                Personalized Academic Journey
            </p>

        </div>

        <div>

            <button
            onclick="
            window.location.href='dashboard.html'
            ">
                 Dashboard
            </button>

        </div>

    </div>

    <!-- Stats -->

    <div class="stats-grid"
    style="
    margin-top:20px;
    margin-bottom:20px;
    ">

        <div class="card">

            <h3>
                 Courses
            </h3>

            <h1>
                8
            </h1>

        </div>

        <div class="card">

            <h3>
                Goals
            </h3>

            <h1>
                4
            </h1>

        </div>

        <div class="card">

            <h3>
                Progress
            </h3>

            <h1>
                50%
            </h1>

        </div>

        <div class="card">

            <h3>
                 Career Path
            </h3>

            <h1>
                AI
            </h1>

        </div>

    </div>

    <!-- Progress Tracker -->

    <div class="progress-box"
    style="
    margin-bottom:20px;
    ">

        <h2>
            Progress Tracker
        </h2>

        <p>
            Academic Journey Progress
        </p>

        <br>

        <progress
        value="2"
        max="4">
        </progress>

        <br><br>

        <h3>
            50% Completed
        </h3>

    </div>

    <!-- Roadmap -->

    <div
    id="roadmap"
    class="course-grid">
    </div>

    <!-- Footer -->

    <div class="footer">

        Personalized Learning Roadmap

        <br><br>

        EduAdvisor API © 2026

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/roadmap.js"></script>

</body>

</html>
