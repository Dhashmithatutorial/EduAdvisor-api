<!DOCTYPE html>
<html>

<head>

    <title>Sign Up - EduAdvisor</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="login-container">

    <h1>
        🎓 EduAdvisor API
    </h1>

    <p style="
    color:gray;
    margin-bottom:30px;
    ">
        Create a New Account
    </p>

    <input
    type="text"
    id="full_name"
    placeholder="Full Name"
    >

    <br><br>

    <input
    type="email"
    id="email"
    placeholder="Email"
    >

    <br><br>

    <input
    type="password"
    id="password"
    placeholder="Password"
    >

    <br><br>

    <button
    onclick="signup()"
    style="
    width:100%;
    ">
        Create Account
    </button>

    <br><br>

    <p id="message"></p>

    <p>

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </p>

</div>

<script src="js/api.js"></script>
<script src="js/signup.js"></script>

</body>

</html>
